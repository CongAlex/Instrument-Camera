
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instrument Translation Camera</title>
</head>
<body>
    <h1>Instrument Translation</h1>

    <video
        id="video"
        autoplay
        playsinline
        muted
        style="width: 100%; max-width: 600px;"
    ></video>

    <p id="status">Camera stopped.</p>

    <button id="start">Start Camera</button>
    <button id="stop" disabled>Stop Camera</button>

    <script>
        const SERVER_URL =
            "https://mixing-zum-mature-awesome.trycloudflare.com ";

        const video = document.getElementById("video");
        const status = document.getElementById("status");
        const startButton = document.getElementById("start");
        const stopButton = document.getElementById("stop");

        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");

        let stream = null;
        let timer = null;
        let sending = false;
        let running = false;

        async function sendFrame() {
            if (
                !running ||
                sending ||
                video.readyState < 2
            ) {
                return;
            }

            sending = true;

            try {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                context.drawImage(
                    video, 0, 0,
                    canvas.width, canvas.height
                );

                const blob = await new Promise(resolve =>
                    canvas.toBlob(resolve, "image/jpeg", 0.7)
                );

                if (!blob || !running) return;

                const response = await fetch(
                    SERVER_URL + "/frame",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/octet-stream"
                        },
                        body: blob
                    }
                );

                if (!response.ok) {
                    throw new Error("Server returned " + response.status);
                }

                status.textContent = "Camera running — frames sending.";
            } catch (error) {
                status.textContent = "Sending failed: " + error.message;
                console.error(error);
            } finally {
                sending = false;
            }
        }

        startButton.addEventListener("click", async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });

                video.srcObject = stream;
                await video.play();

                running = true;
                startButton.disabled = true;
                stopButton.disabled = false;
                status.textContent = "Camera started; connecting...";

                timer = setInterval(sendFrame, 200);
            } catch (error) {
                status.textContent = "Camera error: " + error.message;
                console.error(error);
            }
        });

        stopButton.addEventListener("click", () => {
            running = false;
            clearInterval(timer);
            timer = null;

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            video.srcObject = null;
            startButton.disabled = false;
            stopButton.disabled = true;
            status.textContent = "Camera stopped.";
        });
    </script>
</body>
</html>
